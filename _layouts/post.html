---
layout: portfolio
---
<article class="project-page{% if page.demo %} project-page-demo{% endif %}">
  <a class="back-link" href="{{ '/' | relative_url }}#work"><span aria-hidden="true">←</span> All work</a>
  <header class="project-header">
    <p class="eyebrow">{{ page.date | date: '%Y' }}</p>
    <h1>{{ page.portfolio_title | default: page.title }}</h1>
  </header>
  <div class="project-content">{{ content }}</div>
  <nav class="project-pagination" aria-label="More projects">
    <a class="back-link" href="{{ '/' | relative_url }}#work">← All work</a>
    {% if page.previous %}<a class="next-project" href="{{ page.previous.url | relative_url }}"><span class="eyebrow">Next project</span>{{ page.previous.portfolio_title | default: page.previous.title }} <span aria-hidden="true">↗</span></a>{% endif %}
  </nav>
</article>
